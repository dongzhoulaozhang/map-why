<style>

const ST = [{"name": "约古宗列", "note": "黄河源头，巴颜喀拉山的水是清的", "x": 114.2, "y": 1842.3, "p": 0.0, "major": true}, {"name": "两湖", "note": "先住进扎陵湖、鄂陵湖", "x": 378.1, "y": 1923.1, "p": 0.0381, "major": false}, {"name": "玛多", "note": "海拔四千多米", "x": 529.3, "y": 2000.3, "p": 0.0615, "major": false}, {"name": "贵德", "note": "天下黄河贵德清", "x": 1080.8, "y": 1649.5, "p": 0.2352, "major": false}, {"name": "刘家峡", "note": "大水库在这里发电", "x": 1370.3, "y": 1674.9, "p": 0.2759, "major": false}, {"name": "兰州", "note": "唯一穿城的省会，水还是清的", "x": 1515.5, "y": 1628.3, "p": 0.2969, "major": true}, {"name": "中卫", "note": "沙坡头，沙漠就在河边", "x": 1781.2, "y": 1345.6, "p": 0.3514, "major": true}, {"name": "银川", "note": "塞上江南，沙漠边的大绿洲", "x": 1992.8, "y": 1093.0, "p": 0.3978, "major": true}, {"name": "乌海", "note": "沙漠与黄河握手", "x": 2050.9, "y": 832.3, "p": 0.4355, "major": false}, {"name": "临河", "note": "河套平原，塞外粮仓", "x": 2162.3, "y": 579.3, "p": 0.4751, "major": false}, {"name": "包头", "note": "草原钢城，蒙古语是'有鹿的地方'", "x": 2613.8, "y": 604.7, "p": 0.5394, "major": true}, {"name": "托克托", "note": "注意看！水在这里变黄啦", "x": 2807.2, "y": 682.9, "p": 0.5685, "major": true}, {"name": "老牛湾", "note": "长城在这里遇见黄河", "x": 2839.6, "y": 838.3, "p": 0.5906, "major": true}, {"name": "壶口瀑布", "note": "千里黄河一壶收，最壮观的地方", "x": 2721.4, "y": 1685.1, "p": 0.7107, "major": true}, {"name": "风陵渡·潼关", "note": "三省交界，黄河在这里掉头向东", "x": 2709.2, "y": 1942.5, "p": 0.7472, "major": true}, {"name": "三门峡", "note": "三门峡水电站，大坝在这里拦河发电", "x": 2887.8, "y": 1916.3, "p": 0.7727, "major": true}, {"name": "小浪底", "note": "每年放水冲沙，人造小洪峰", "x": 3061.7, "y": 1901.5, "p": 0.7968, "major": false}, {"name": "郑州", "note": "出了山，走进华北平原", "x": 3253.5, "y": 1897.3, "p": 0.8234, "major": true}, {"name": "开封", "note": "地上悬河！河底比城里高十米", "x": 3424.0, "y": 1886.9, "p": 0.8469, "major": true}, {"name": "济南", "note": "从泉城旁边流过", "x": 3949.7, "y": 1501.3, "p": 0.938, "major": false}, {"name": "东营", "note": "入海！每年造出一块新土地", "x": 4270.5, "y": 1246.6, "p": 0.9953, "major": true}];
const SPLIT = {"x": 2807.2, "y": 682.9, "p": 0.5685};
const yell = document.getElementById('yellmark');

const svg = document.getElementById('map');
const stage = document.getElementById('stage');
const pinBox = document.getElementById('pins');
const cap = document.getElementById('cap');
const head = document.getElementById('head');
const endBox = document.getElementById('end');
const barfill = document.getElementById('barfill');

let SW = 0, SH = 0;
function fitStage() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let h = Math.min(vh, vw * 16 / 9);
  let w = h * 9 / 16;
  if (w > vw) { w = vw; h = w * 16 / 9; }
  SW = Math.round(w); SH = Math.round(h);
  stage.style.width = SW + 'px';
  stage.style.height = SH + 'px';
  stage.style.setProperty('--u', (SW / 100).toFixed(3) + 'px');
  placePins();
}

const CUM = [0];
for (let i = 1; i < PTS.length; i++)
  CUM.push(CUM[i - 1] + Math.hypot(PTS[i][0] - PTS[i - 1][0], PTS[i][1] - PTS[i - 1][1]));
const TOTAL = CUM[CUM.length - 1];

function pointAt(p) {
  const s = Math.max(0, Math.min(1, p)) * TOTAL;
  let lo = 0, hi = CUM.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (CUM[mid] <= s) lo = mid; else hi = mid; }
  const seg = CUM[hi] - CUM[lo] || 1;
  const k = (s - CUM[lo]) / seg;
  return [PTS[lo][0] + (PTS[hi][0] - PTS[lo][0]) * k,
          PTS[lo][1] + (PTS[hi][1] - PTS[lo][1]) * k];
}

const PIN_W = [];
ST.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'pin' + (i % 2 ? ' rev' : '');
  el.innerHTML = '<i></i><b>' + s.name + '</b>';
  pinBox.appendChild(el);
  PIN_W.push(el);
});

const segs = [
  {core: document.querySelector('.core.clear'), halo: document.querySelector('.halo.clear')},
  {core: document.querySelector('.core.muddy'), halo: document.querySelector('.halo.muddy')}
];
segs.forEach(s => { s.len = s.core.getTotalLength(); });
const LEN_TOTAL = segs[0].len + segs[1].len;

function drawLine(p) {
  const cut = p * LEN_TOTAL;
  let acc = 0;
  segs.forEach(s => {
    const v = Math.max(0, Math.min(s.len, cut - acc));
    acc += s.len;
    s.core.style.strokeDasharray = v + ' ' + (s.len + 20);
    s.halo.style.strokeDasharray = v + ' ' + (s.len + 20);
  });
}

let vb = {x: 0, y: 0, w: 900, h: 1600};
function setVB(cx, cy, hgt) {
  const w = hgt * 9 / 16;
  let x = cx - w / 2;
  let y = cy - hgt * 0.54;
  x = Math.max(0, Math.min(W - w, x));
  y = Math.max(0, Math.min(H - hgt, y));
  svg.setAttribute('viewBox', x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + w.toFixed(1) + ' ' + hgt.toFixed(1));
  vb = {x, y, w, h: hgt};
}

function placePins() {
  const U = SW / 100, FS = 2.75 * U;
  ST.forEach((s, i) => {
    const sx = (s.x - vb.x) / vb.w * SW;
    const sy = (s.y - vb.y) / vb.h * SH;
    let nameW = 0;
    for (const ch of s.name) nameW += FS * (ch.charCodeAt(0) > 127 ? 1 : 0.55);
    const pw = (2.6 + 1.6) * U + nameW + 4 * U, ph = 5.3 * U;
    const out = sx - pw / 2 < 4 || sx + pw / 2 > SW - 4 || sy - ph / 2 < 4 || sy + ph / 2 > SH - 4;
    PIN_W[i].style.display = out ? 'none' : 'flex';
    PIN_W[i].style.left = sx.toFixed(1) + 'px';
    PIN_W[i].style.top = sy.toFixed(1) + 'px';
  });
  const yx = (SPLIT.x - vb.x) / vb.w * SW;
  const yy = (SPLIT.y - vb.y) / vb.h * SH;
  const yOut = yx < 4 || yx > SW - 4 || yy < 4 || yy > SH - 4;
  yell.style.display = yOut ? 'none' : 'block';
  const yw = yell.offsetWidth || 200, yh = yell.offsetHeight || 76;
  let mx = yx - 26, toRight = false;
  if (mx - yw < 6) { mx = yx + 26; toRight = true; }
  if (mx + yw > SW - 6) mx = SW - 6 - yw;
  const my = Math.max(yh / 2 + 6, Math.min(SH - yh / 2 - 6, yy));
  yell.classList.toggle('r', toRight);
  yell.style.left = mx.toFixed(1) + 'px';
  yell.style.top = my.toFixed(1) + 'px';
}

  PIN_W.forEach((el, i) => el.addEventListener('click', () => showCap(i)));

/* ---------- 儿童背景音乐：八音盒风格，网页内实时合成，无外部音频文件 ---------- */
const btnMusic = document.getElementById('music');
let AC = null, musicOn = false, loopT = null;
const NOTE = s => 523.25 * Math.pow(2, s / 12);
const MEL = [0,4,7,9,7,4,2,0,  4,7,9,12,9,7,4,2,  7,9,12,9,7,4,2,0,  2,4,7,4,2,0,-3,-5];
const BASS = [[0,-24],[8,-27],[16,-17],[24,-24]];
function tone(f, at, dur, vol, type) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(AC.destination);
  o.start(at); o.stop(at + dur + 0.05);
  if (!type) {
    const o2 = AC.createOscillator(), g2 = AC.createGain();
    o2.type = 'sine'; o2.frequency.value = f * 2;
    g2.gain.setValueAtTime(0, at);
    g2.gain.linearRampToValueAtTime(vol * 0.22, at + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, at + dur * 0.5);
    o2.connect(g2).connect(AC.destination);
    o2.start(at); o2.stop(at + dur * 0.5 + 0.05);
  }
}
function musicLoop() {
  if (!musicOn) return;
  const t0 = AC.currentTime + 0.08, B = 60 / 96;
  MEL.forEach((s, i) => { if (s != null) tone(NOTE(s), t0 + i * B, 1.3, 0.14); });
  BASS.forEach(([b, s]) => tone(NOTE(s), t0 + b * B, 1.9, 0.09, 'triangle'));
  loopT = setTimeout(musicLoop, MEL.length * B * 1000 - 60);
}
function startMusic() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  AC.resume().then(() => {
    if (!musicOn) { musicOn = true; btnMusic.textContent = '🔊 音乐'; musicLoop(); }
  }).catch(() => {});
}
function stopMusic() {
  musicOn = false; clearTimeout(loopT);
  if (AC) AC.suspend();
  btnMusic.textContent = '♪ 点我听音乐';
}
btnMusic.onclick = () => musicOn ? stopMusic() : startMusic();

const DUR = 20000, HOLD = 2000;
let accum = 0, prev = 0, pausedUntil = 0, lastCap = -1, raf = 0;

function sm(a, b, t) {
  const x = Math.max(0, Math.min(1, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
}
function hgtAt(t) {
  const dip = sm(0.42, 0.55, t) * (1 - sm(0.78, 0.90, t));
  return 1680 - 340 * dip + (t > 0.90 ? (t - 0.90) / 0.10 * 700 : 0);
}

function showCap(i, holdMs) {
  cap.querySelector('b').textContent = ST[i].name;
  cap.querySelector('span').textContent = ST[i].note;
  cap.classList.add('on');
  PIN_W.forEach((el, j) => el.classList.toggle('hot', j === i));
  clearTimeout(cap._t);
  cap._t = setTimeout(() => { cap.classList.remove('on'); PIN_W.forEach(el => el.classList.remove('hot')); }, holdMs || 2200);
}

function frame(now) {
  if (!prev) prev = now;
  const dt = Math.min(50, now - prev);
  prev = now;
  if (now >= pausedUntil) accum += dt;
  const t = Math.min(1, accum / DUR);

  const cam = Math.min(1, Math.max(0, (t - 0.015) / 0.915));
  const hgt = hgtAt(t);
  const cp = pointAt(cam);
  setVB(cp[0], cp[1], hgt);
  placePins();

  drawLine(Math.min(1, t / 0.945));
  barfill.style.width = (t * 100).toFixed(1) + '%';

  head.classList.toggle('on', t < 0.28);
  endBox.classList.toggle('on', t > 0.96);
  stage.classList.toggle('done', t > 0.96);

  let active = -1;
  ST.forEach((s, i) => {
    if (cam >= s.p - 0.004) { PIN_W[i].classList.add('on'); active = i; }
  });
  yell.classList.toggle('on', cam >= SPLIT.p - 0.004);
  if (active >= 0 && ST[active].major && active !== lastCap) {
    lastCap = active;
    showCap(active, HOLD);
    pausedUntil = now + HOLD * 0.88;
  }

  if (t < 1) raf = requestAnimationFrame(frame);
  else cap.classList.remove('on');
  if (t > 0.955) cap.classList.remove('on');
}

function play() {
  cancelAnimationFrame(raf);
  accum = 0; prev = 0; pausedUntil = 0; lastCap = -1;
  ST.forEach((s, i) => PIN_W[i].classList.remove('on'));
  endBox.classList.remove('on');
  stage.classList.remove('done');
  startMusic();
  raf = requestAnimationFrame(frame);
}

document.getElementById('replay').onclick = play;
btnMusic.onclick = () => musicOn ? stopMusic() : startMusic();
document.addEventListener('pointerdown', function once() {
  if (!musicOn) startMusic();
  document.removeEventListener('pointerdown', once);
});
window.addEventListener('resize', () => { fitStage(); });

fitStage();

const qs = new URLSearchParams(location.search);
if (qs.has('t')) {
  const tt = Math.max(0, Math.min(1, parseFloat(qs.get('t')) || 0));
  (function freeze() {
    const t = tt;
    const cam = Math.min(1, Math.max(0, (t - 0.015) / 0.915));
    const hgt = hgtAt(t);
    const cp = pointAt(cam);
    setVB(cp[0], cp[1], hgt);
    placePins();
    drawLine(Math.min(1, t / 0.945));
    barfill.style.width = (t * 100).toFixed(1) + '%';
    head.classList.toggle('on', t < 0.28);
    endBox.classList.toggle('on', t > 0.96);
    stage.classList.toggle('done', t > 0.96);
    let act = -1;
    ST.forEach((s, i) => { if (cam >= s.p - 0.004) { PIN_W[i].classList.add('on'); act = i; } });
    yell.classList.toggle('on', cam >= SPLIT.p - 0.004);
    if (act >= 0 && t < 0.955) showCap(act);
  })();
} else {
  play();
}
